name: Train Gaza PointNet AI

on:
  push:
    branches: [main]
    paths:
      - 'ai/model.py'
      - 'ai/prepare_dataset.py'
      - 'ai/train.py'
      - 'ai/infer.py'
      - 'ai/requirements.txt'
      - '.github/workflows/ai-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gaza-ai-training
  cancel-in-progress: true

jobs:
  train-and-infer:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install AI dependencies
        run: pip install -r ai/requirements.txt

      - name: Validate Python
        run: |
          python -m py_compile ai/model.py ai/prepare_dataset.py ai/train.py ai/infer.py

      - name: Prepare Gaza triangle dataset
        run: |
          mkdir -p ai/work ai/output
          python ai/prepare_dataset.py \
            --mesh models/gaza_strip_2014.glb \
            --out ai/work/gaza_dataset.npz \
            --meta ai/work/gaza_dataset_meta.json

      - name: Train PointNet semantic model
        working-directory: ai
        run: |
          python train.py \
            --data work/gaza_dataset.npz \
            --out output/pointnet_gaza.pt \
            --report output/training_report.json \
            --epochs 4 \
            --steps 70 \
            --block-size 2048 \
            --batch-size 4

      - name: Run full-scene AI inference
        working-directory: ai
        run: |
          python infer.py \
            --data work/gaza_dataset.npz \
            --checkpoint output/pointnet_gaza.pt \
            --out-dir output \
            --chunk-size 8192 \
            --display-points 220000

      - name: Save bootstrap dataset metadata
        run: cp ai/work/gaza_dataset_meta.json ai/output/gaza_dataset_meta.json

      - name: Commit trained AI outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/output/
          if git diff --cached --quiet; then
            echo "No AI output changes to commit"
          else
            git commit -m "Update Gaza PointNet AI outputs [skip ai]"
            git push
          fi
